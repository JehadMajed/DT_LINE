# Reference go2rtc.yaml for the Digital Twin Pi camera.
# Copy the relevant parts into /home/jehadroot/go2rtc.yaml, then:
#   sudo systemctl restart dt-camera
#
# Key hardening vs a plain setup:
#   - the stream producer restarts automatically when it dies (go2rtc does this
#     on the next client connect; "restart" keeps it warm)
#   - a single low-latency H264 source, transcoded once
#   - go2rtc's own API bound to localhost; Tailscale Funnel does the exposure

api:
  listen: "127.0.0.1:1984"

# Tailscale Funnel / serve should point https://rpi5.tail05b01c.ts.net/ -> 127.0.0.1:1984
# That config persists across reboots:  tailscale serve status   to verify.

streams:
  pi_cam:
    # rpicam-vid pushes raw H264 straight into go2rtc over a pipe.
    # -t 0            : run forever
    # --inline        : send SPS/PPS with every IDR (needed for MSE/WebRTC late join)
    # --low-latency   : minimise encoder buffering
    # tune resolution/fps/bitrate to taste; 1280x720@15 is a safe Pi 5 default.
    - "exec:rpicam-vid -t 0 --inline --low-latency --nopreview --codec h264 --width 1280 --height 720 --framerate 15 --bitrate 2500000 -o - #video=h264"

# Optional: restart the exec producer if it emits EOF (the error in your screenshot).
# go2rtc already retries on demand; this makes it retry proactively.
webrtc:
  candidates:
    - stun:8555
